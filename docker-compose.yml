version: '3'
services:
   mysql:
     image: mysql:8
     environment:
       MYSQL_ROOT_PASSWORD: root
       MYSQL_DATABASE: ai_notes_generator
     ports: 
        - "3307:3306"
   app:
    build: .
    ports:
        - "8501:8501"
    depends_on:
        - mysql  
    volumes:
        - ./.secrets.toml:/root/.streamlit/secrets.toml
    



      
